# One universal app for Apple Silicon and Intel; ZIP updater payload and drag-to-install DMG.
# Run manually to download artifacts without publishing, or tag vX.Y.Z to attach to a release.
name: Mac build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: |
          cargo test --lib
          rustc --edition=2021 --test src/update_install.rs -o /tmp/update-tests
          /tmp/update-tests

      - name: Build (Apple Silicon and Intel)
        run: |
          cargo build --release --bin t2f --target aarch64-apple-darwin
          cargo build --release --bin t2f --target x86_64-apple-darwin

      - name: Package universal app, update ZIP and installer DMG
        run: |
          mkdir -p dist
          lipo -create -output dist/t2f-universal \
            target/aarch64-apple-darwin/release/t2f \
            target/x86_64-apple-darwin/release/t2f
          lipo dist/t2f-universal -verify_arch arm64 x86_64
          VERSION=$(ruby -e 'puts File.read("Cargo.toml")[/^version\s*=\s*"([^"]+)"/, 1]')
          bash installer/mac/package.sh --binary dist/t2f-universal --output dist --version "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: RoadToAlfendrof-Mac
          path: |
            dist/RoadToAlfendrof-Mac.zip
            dist/RoadToAlfendrof-Mac.dmg
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RoadToAlfendrof-Mac.zip
            dist/RoadToAlfendrof-Mac.dmg
          fail_on_unmatched_files: true
