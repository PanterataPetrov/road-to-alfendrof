name: Linux build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libvulkan1 mesa-vulkan-drivers xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: |
          cargo test --lib
          rustc --edition=2021 --test src/update_install.rs -o /tmp/update-tests
          /tmp/update-tests
      - name: Build
        run: cargo build --locked --release --bin t2f
      - name: Package
        run: sh installer/linux/package.sh target/release/t2f dist x86_64
      - name: Build AppImage
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            -o /tmp/appimagetool
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool' | sha256sum --check
          chmod +x /tmp/appimagetool
          sh installer/linux/appimage.sh target/release/t2f /tmp/appimagetool dist
      - name: Smoke-test packaged AppImage
        env:
          # Never let a packaging smoke run replace its artifact with a live release.
          https_proxy: http://127.0.0.1:9
          WGPU_BACKEND: vulkan
        run: |
          APPIMAGE=$(find dist -maxdepth 1 -name 'RoadToAlfendrof-*-x86_64.AppImage' -print -quit)
          timeout 60s xvfb-run -a "$APPIMAGE" --appimage-extract-and-run \
            --title --screenshot "$PWD/dist/linux-smoke.png" --delay 3
      - uses: actions/upload-artifact@v4
        with:
          name: RoadToAlfendrof-Linux-x86_64
          path: |
            dist/RoadToAlfendrof-Linux-x86_64.tar.gz
            dist/RoadToAlfendrof-*-x86_64.AppImage
            dist/linux-smoke.png
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RoadToAlfendrof-Linux-x86_64.tar.gz
            dist/RoadToAlfendrof-*-x86_64.AppImage
